name: clienta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/news/
    - assets/images/events/
    - assets/images/profile/
    - assets/images/people/

  # Source Sans 3 (formerly Source Sans Pro) by Adobe, SIL Open Font License.
  # It has no ExtraBold, so weight 800 uses the Bold file.
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-It.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 800
        - asset: assets/fonts/SourceSans3-Black.ttf
          weight: 900
